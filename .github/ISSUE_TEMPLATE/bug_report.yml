name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v1.2.0 or 3f9a1c2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Windows 11, Node 22, Chrome 130 / iOS 18 PWA
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Please remove tokens, keys and other secrets before pasting.
      render: shell
